<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de Campo das Nascentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
  /* Layout: single column field form, four sections, one primary action at the end. */
  :root {
    color-scheme: light;
    --bg: #EDF2F1;
    --surface: #FFFFFF;
    --ink: #102B2A;
    --muted: #506664;
    --line: #CFDAD8;
    --accent: #0B6E78;
    --accent-ink: #FFFFFF;
    --chip: #E3ECEA;
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-body: 'Source Sans 3', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0B1818; --surface: #122424; --ink: #E3EFED; --muted: #92AAA7; --line: #244140;
      --accent: #4FC3CE; --accent-ink: #05201F; --chip: #1A3231;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 16px; line-height: 1.45;
    padding: 20px 16px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  header h1 { font-family: var(--font-display); font-size: 1.75rem; line-height: 1.1; margin: 0 0 8px; text-wrap: balance; }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  .meta { margin-top: 12px; font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }
  form { display: flex; flex-direction: column; gap: 20px; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 16px 20px; display: flex; flex-direction: column; gap: 16px; }
  section h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0; text-wrap: balance; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lab { font-weight: 600; font-size: .92rem; }
  .sub { font-weight: 700; font-size: .92rem; margin: 4px 0 -4px; padding-top: 12px; border-top: 1px solid var(--line); }
  .hint { color: var(--muted); font-size: .84rem; margin: 0; }
  input[type="text"], input[type="datetime-local"], select, textarea {
    width: 100%; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  textarea { resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .filebtn { position: relative; display: inline-flex; align-self: flex-start; background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: .92rem; cursor: pointer; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .preview { max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--line); display: none; align-self: flex-start; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 14px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 600; }
  .btn.gps { align-self: flex-start; padding: 10px 14px; font-weight: 600; background: var(--chip); color: var(--ink); border-color: var(--line); }
  .btn[disabled] { opacity: .6; cursor: default; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 480px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .92rem; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Coleta em Campo</h1>
    <p>Emissão de Laudo Ambiental Nativo (.DOCX)</p>
    <div class="meta">Rascunho salvo neste aparelho</div>
  </header>

  <form id="ficha" autocomplete="off"></form>

  <div class="actions">
    <button type="button" class="btn" id="btnGerar">Gerar e baixar laudo (.docx)</button>
    <button type="button" class="btn ghost" id="btnLimpar">Limpar ficha</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
  var SECTIONS = [
    { title: '1. Identificação Geral', kind: 'kv', fields: [
      { k: 'nomeCorrego', label: 'Nome do Córrego', type: 'text', ph: 'Ex: Córrego Anhanduí' },
      { k: 'codigoPonto', label: 'Código do Ponto', type: 'text', ph: 'Ex: PT-01' },
      { k: 'margem', label: 'Margem', type: 'select', opts: ['Margem direita', 'Margem esquerda', 'Ambas / Centro do Córrego'] },
      { k: 'coordenadas', label: 'Coordenadas (GPS)', type: 'text', ph: 'Latitude e Longitude', gps: true, hint: 'Toque no botão para preencher com o GPS do aparelho, ou digite as coordenadas.' },
      { k: 'endereco', label: 'Endereço / Referência Visual', type: 'text', ph: 'Ex: Próximo à ponte da Av. Brasil' },
      { k: 'dataHora', label: 'Data e Horário da Coleta', type: 'datetime' },
      { k: 'responsavel', label: 'Nome do Responsável Técnico', type: 'text', ph: 'Ex: Eng. João Silva' }
    ]},
    { title: '2. Condições Ambientais no Campo', kind: 'kv', fields: [
      { k: 'meteorologia', label: 'Condições Meteorológicas', type: 'select', opts: ['Ensolarado', 'Nublado', 'Chuvoso'] },
      { k: 'chuvaAnterior', label: 'Chuva nos Dias Anteriores?', type: 'select', opts: ['Não (Sem impacto aparente)', 'Sim - Chuva intensa (Alterou turbidez e vazão)', 'Sim - Chuva leve'] },
      { type: 'sub', label: 'Aspectos Visuais da Água' },
      { k: 'coloracao', label: 'Coloração', type: 'text', ph: 'Ex: Incolor, Barrenta, Esverdeada' },
      { k: 'odor', label: 'Odor', type: 'text', ph: 'Ex: Ausente, Esgoto, Químico' },
      { k: 'turbidez', label: 'Turbidez Aparente', type: 'text', ph: 'Ex: Baixa, Média, Alta' },
      { k: 'espuma', label: 'Presença de Espuma', type: 'text', ph: 'Ex: Ausente, Abundante' },
      { k: 'oleo', label: 'Óleo / Graxa', type: 'text', ph: 'Ex: Ausente, Manchas iridescentes' },
      { k: 'residuos', label: 'Lixo / Resíduos Flutuantes', type: 'text', ph: 'Ex: Ausente, Plásticos' }
    ]},
    { title: '3. Observações de Campo', kind: 'area', fields: [
      { k: 'observacoes', label: 'Observações', type: 'area', ph: 'Descreva anormalidades na bacia contribuinte, lançamentos/descargas clandestinas aparentes, erosões nas margens, assoreamento, etc.' }
    ]},
    { title: '4. Registro Fotográfico (Câmera)', kind: 'photos', fields: [
      { k: 'fMontante', label: '📸 Foto Montante', short: 'Montante', type: 'photo' },
      { k: 'fJusante', label: '📸 Foto Jusante', short: 'Jusante', type: 'photo' },
      { k: 'fBalde', label: '📸 Foto Balde da Coleta', short: 'Balde da Coleta', type: 'photo' }
    ]}
  ];

  var DRAFT_KEY = 'ficha-coleta-campo-rascunho';
  var form = document.getElementById('ficha');
  var photos = {};

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  function fieldHTML(f) {
    if (f.type === 'sub') return '<div class="sub">' + esc(f.label) + '</div>';
    var id = 'f-' + f.k;
    var control;
    if (f.type === 'select') {
      control = '<select id="' + id + '" data-k="' + f.k + '"><option value="">Selecione</option>' +
        f.opts.map(function (o) { return '<option value="' + esc(o) + '">' + esc(o) + '</option>'; }).join('') + '</select>';
    } else if (f.type === 'datetime') {
      control = '<input id="' + id + '" type="datetime-local" data-k="' + f.k + '">';
    } else if (f.type === 'area') {
      control = '<textarea id="' + id + '" rows="5" data-k="' + f.k + '" placeholder="' + esc(f.ph || '') + '"></textarea>';
    } else if (f.type === 'photo') {
      return '<div class="field"><div class="lab">' + esc(f.label) + '</div><label class="filebtn">Tirar ou anexar foto<input type="file" accept="image/*" capture="environment" data-photo="' + f.k + '" aria-label="' + esc(f.label) + '"></label><img class="preview" id="img-' + f.k + '" alt="Prévia: ' + esc(f.short) + '"></div>';
    } else {
      control = '<input id="' + id + '" type="text" data-k="' + f.k + '" placeholder="' + esc(f.ph || '') + '">';
    }
    var gps = f.gps ? '<button type="button" class="btn gps" id="btnGPS">Pegar minha localização</button>' : '';
    return '<div class="field"><label class="lab" for="' + id + '">' + esc(f.label) + '</label>' + control + gps + (f.hint ? '<p class="hint">' + esc(f.hint) + '</p>' : '') + '</div>';
  }

  function render() {
    form.innerHTML = SECTIONS.map(function (s) {
      return '<section><h2>' + esc(s.title) + '</h2>' + s.fields.map(fieldHTML).join('') + '</section>';
    }).join('');
  }

  function collect() {
    var vals = {};
    form.querySelectorAll('[data-k]').forEach(function (el) { vals[el.getAttribute('data-k')] = el.value; });
    return vals;
  }

  function saveDraft() {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(collect())); } catch (e) {}
  }

  function nowLocal() {
    var d = new Date();
    return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }

  function restore() {
    var vals = {};
    try { vals = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}') || {}; } catch (e) {}
    form.querySelectorAll('[data-k]').forEach(function (el) {
      var v = vals[el.getAttribute('data-k')];
      if (typeof v === 'string') el.value = v;
    });
    var dt = document.getElementById('f-dataHora');
    if (dt && !dt.value) dt.value = nowLocal();
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 5000);
  }

  function pegarGPS() {
    var btn = document.getElementById('btnGPS');
    if (!navigator.geolocation) { toast('Este navegador não oferece localização.'); return; }
    if (window.isSecureContext === false) { toast('A localização só funciona em página com endereço seguro (https).'); return; }
    btn.disabled = true; btn.textContent = 'Buscando sinal de GPS...';
    function fim() { btn.disabled = false; btn.textContent = 'Pegar minha localização'; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      document.getElementById('f-coordenadas').value = pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6);
      saveDraft();
      toast('Localização obtida, precisão de cerca de ' + Math.round(pos.coords.accuracy) + ' m.');
      fim();
    }, function (err) {
      var msg = err.code === 1 ? 'Permissão de localização negada. Libere a localização para este site nas configurações do navegador.'
        : err.code === 2 ? 'Não foi possível obter a posição. Verifique se o GPS está ligado.'
        : 'Tempo esgotado. Tente de novo em um local aberto.';
      toast(msg);
      fim();
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }

  function handlePhoto(input) {
    var key = input.getAttribute('data-photo');
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var max = 900, w = img.width, h = img.height;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var url = c.toDataURL('image/jpeg', 0.82);
        var bin = atob(url.split(',')[1]);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        photos[key] = { bytes: bytes, w: w, h: h };
        var pv = document.getElementById('img-' + key);
        pv.src = url; pv.style.display = 'block';
      };
      img.onerror = function () { toast('Não foi possível ler essa imagem.'); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function gerar() {
    var D = window.docx;
    if (!D || typeof saveAs !== 'function') { toast('As bibliotecas do Word não carregaram. Verifique a conexão e recarregue a página.'); return; }
    var btn = document.getElementById('btnGerar');
    btn.disabled = true; btn.textContent = 'Gerando arquivo Word...';
    try {
      var v = collect();
      var green = '1B4D3E';
      function val(k) {
        var x = v[k] || '';
        if (k === 'dataHora') x = x.replace('T', ' ');
        return x || '-';
      }
      function cell(text, o) {
        o = o || {};
        return new D.TableCell({
          width: { size: o.w || 50, type: D.WidthType.PERCENTAGE },
          shading: o.fill ? { type: D.ShadingType.CLEAR, fill: o.fill, color: 'auto' } : undefined,
          children: [new D.Paragraph({ children: [new D.TextRun({ text: String(text), bold: !!o.bold, size: 22 })] })]
        });
      }
      function heading(t) {
        return new D.Paragraph({ spacing: { before: 280, after: 100 }, children: [new D.TextRun({ text: t, bold: true, size: 24, color: green })] });
      }
      var kids = [
        new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.TextRun({ text: 'LAUDO TÉCNICO DE COLETA AMBIENTAL', bold: true, size: 32, color: green })] })
      ];
      SECTIONS.forEach(function (s) {
        kids.push(heading(s.title));
        if (s.kind === 'kv') {
          var rows = s.fields.filter(function (f) { return f.k; }).map(function (f) {
            return new D.TableRow({ children: [cell(f.label + ':', { w: 38, bold: true, fill: 'E8EFED' }), cell(val(f.k), { w: 62 })] });
          });
          kids.push(new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: rows }));
        } else if (s.kind === 'area') {
          kids.push(new D.Paragraph({ children: [new D.TextRun({ text: v.observacoes || 'Nenhuma observação informada.', size: 22 })] }));
        } else if (s.kind === 'photos') {
          var cells = s.fields.map(function (f) {
            var ch = [new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.TextRun({ text: f.short, bold: true, size: 22 })] })];
            var ph = photos[f.k];
            if (ph) {
              ch.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.ImageRun({ data: ph.bytes, transformation: { width: 170, height: Math.round(170 * ph.h / ph.w) } })] }));
            } else {
              ch.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, children: [new D.TextRun({ text: '(Sem foto)', size: 22 })] }));
            }
            return new D.TableCell({ width: { size: 33, type: D.WidthType.PERCENTAGE }, children: ch });
          });
          kids.push(new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [new D.TableRow({ children: cells })] }));
        }
      });
      var doc = new D.Document({ sections: [{ properties: {}, children: kids }] });
      var blob = await D.Packer.toBlob(doc);
      var base = (v.codigoPonto || 'Coleta').replace(/[^\wÀ-ÿ-]+/g, '_').slice(0, 60);
      saveAs(blob, 'Laudo_' + base + '.docx');
      toast('Laudo gerado. Procure o arquivo na pasta de downloads do aparelho.');
    } catch (e) {
      toast('Não foi possível gerar o arquivo' + (e && e.message ? ': ' + e.message : '.'));
    } finally {
      btn.disabled = false; btn.textContent = 'Gerar e baixar laudo (.docx)';
    }
  }

  var clearArmed = false, clearTimer;
  function limpar() {
    var b = document.getElementById('btnLimpar');
    if (!clearArmed) {
      clearArmed = true; b.textContent = 'Toque de novo para apagar tudo';
      clearTimer = setTimeout(function () { clearArmed = false; b.textContent = 'Limpar ficha'; }, 4000);
      return;
    }
    clearTimeout(clearTimer); clearArmed = false; b.textContent = 'Limpar ficha';
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    photos = {};
    form.reset();
    form.querySelectorAll('.preview').forEach(function (im) { im.removeAttribute('src'); im.style.display = 'none'; });
    var dt = document.getElementById('f-dataHora');
    if (dt) dt.value = nowLocal();
    toast('Ficha limpa.');
  }

  render();
  restore();
  form.addEventListener('input', saveDraft);
  form.addEventListener('change', function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute('data-photo')) handlePhoto(e.target);
    saveDraft();
  });
  document.getElementById('btnGPS').addEventListener('click', pegarGPS);
  document.getElementById('btnGerar').addEventListener('click', gerar);
  document.getElementById('btnLimpar').addEventListener('click', limpar);
</script>
</body>
</html>
